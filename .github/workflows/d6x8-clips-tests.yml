name: D6X8 Clips tests
on:
  pull_request:
    paths:
      - 'projects/d6x8-clips/**'
      - '.github/workflows/d6x8-clips-tests.yml'
  push:
    branches: [main]
    paths:
      - 'projects/d6x8-clips/**'
      - '.github/workflows/d6x8-clips-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/d6x8-clips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify FFmpeg
        run: ffmpeg -version && ffprobe -version
      - name: Install packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit and real render tests
        run: python -m pytest -q
