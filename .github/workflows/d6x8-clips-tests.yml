name: D6X8 Clips tests
on:
  pull_request:
    paths:
      - 'projects/d6x8-clips/**'
      - '.github/workflows/d6x8-clips-tests.yml'
  push:
    branches: [main]
    paths:
      - 'projects/d6x8-clips/**'
      - '.github/workflows/d6x8-clips-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/d6x8-clips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg from cached package lists
        run: sudo apt-get install -y ffmpeg && ffmpeg -version && ffprobe -version
      - name: Install packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit and real render tests
        run: python -m pytest -q
      - name: Install browser for responsive and workflow checks
        run: |
          browser_dir="$RUNNER_TEMP/droxion-browser"
          npm install --prefix "$browser_dir" --no-audit --no-fund @sparticuz/chromium@141.0.0
          cd "$browser_dir"
          browser=$(node --input-type=module -e 'import chromium from "@sparticuz/chromium"; console.log(await chromium.executablePath())')
          printf 'DROXION_BROWSER=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Test mobile and desktop in Chromium
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8769 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8769/api/health
          python tests/browser_check.py
      - name: Save responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droxionclips-browser-screenshots
          path: projects/d6x8-clips/browser-screenshots/*.png
          if-no-files-found: ignore
