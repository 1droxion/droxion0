name: DroxionClips online beta smoke
on:
  pull_request:
    paths:
      - 'projects/d6x8-clips/**'
      - '.github/workflows/droxionclips-cloud-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'projects/d6x8-clips/**'
jobs:
  cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/d6x8-clips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projects/d6x8-clips/requirements.txt
      - name: Install cloud beta packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q cloud_app.py
      - name: Test authenticated editor and selections
        run: python -m pytest -q tests/test_cloud_app.py
