services:
  - type: web
    name: droxion-meet-private-qa
    runtime: python
    plan: free
    region: ohio
    repo: https://github.com/1droxion/droxion0
    branch: codex/meet-private-beta
    rootDir: projects/droxion-meet
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn member.wsgi --bind 0.0.0.0:$PORT --access-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: MEET_HOST
        value: droxion-meet-private-qa.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: MEET_BETA_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: droxion-meet-qa-db
          property: connectionString
databases:
  - name: droxion-meet-qa-db
    plan: free
    region: ohio
    postgresMajorVersion: "18"
    ipAllowList: []
